services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: warden-falkordb
    ports:
      - "6380:6379"   # graph queries (host 6380: a WSL Redis already uses 6379)
      - "3000:3000"   # FalkorDB Browser
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    restart: unless-stopped

  # App data (users, teams, projects, chats). In production this is Neon; locally it's this container.
  postgres:
    image: postgres:16-alpine
    container_name: warden-postgres
    environment:
      POSTGRES_USER: warden
      POSTGRES_PASSWORD: warden
      POSTGRES_DB: warden
    ports:
      - "5433:5432"   # host 5433, in case a local Postgres already uses 5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  # The backend as it runs in production. Opt-in: `docker compose --profile api up -d --build`
  api:
    profiles: ["api"]
    build: ./backend
    container_name: warden-api
    depends_on: [falkordb, postgres]
    env_file:
      - path: .env
        required: false
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
      FALKORDB_SSL: "false"
      DATABASE_URL: postgresql+psycopg://warden:warden@postgres:5432/warden
      CORS_ORIGINS: http://localhost:5173
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  falkordb-data:
  postgres-data:
