services:
  falkordb:
    image: falkordb/falkordb:latest
    container_name: warden-falkordb
    ports:
      - "6380:6379"   # graph queries (host 6380: a WSL Redis already uses 6379)
      - "3000:3000"   # FalkorDB Browser
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    restart: unless-stopped

volumes:
  falkordb-data:
